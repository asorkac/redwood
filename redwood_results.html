<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Redwood Results</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --text: #1f2421; --muted: #6a716c;
    --border: #d9d7cf; --g1: #c2571a; --g2: #2f6f5e; --accent: #2f6f5e; --accent-text: #fff;
    color-scheme: light; box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151816; --card: #1f2321; --text: #ecefec; --muted: #9aa39d;
      --border: #3a413d; --g1: #f0985f; --g2: #6fc2aa; --accent: #6fc2aa; --accent-text: #0f1a16;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    padding: 24px 16px;
    padding-top: max(24px, env(safe-area-inset-top, 0px));
    padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
  }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: clamp(24px, 5vw, 32px); margin: 0 0 6px; }
  h2 { font-size: 18px; margin: 0 0 14px; }
  .sans { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
  .toolbar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; font-size: 14px; }
  button {
    font: inherit; font-size: 14px; font-weight: 600; background: var(--accent); color: var(--accent-text);
    border: 0; border-radius: 10px; padding: 9px 16px; cursor: pointer;
  }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 22px; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
  .grid .card { margin: 0; }
  .g1 { border-top: 5px solid var(--g1); }
  .g2 { border-top: 5px solid var(--g2); }
  .big { font-size: 36px; font-weight: 600; line-height: 1.1; }
  .lbl { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .row { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--border); font-size: 15px; }
  .row span:first-child { color: var(--muted); }
  .bar { display: flex; height: 30px; border-radius: 8px; overflow: hidden; background: var(--border); margin: 6px 0 14px; font-size: 13px; color: #fff; }
  .bar div { display: flex; align-items: center; justify-content: center; white-space: nowrap; }
  .bar .more { background: #5b6b8c; } .bar .less { background: #8c5b7a; }
  .barlabel { font-size: 14px; color: var(--muted); }
  .diff { font-size: 17px; line-height: 1.5; }
  svg { width: 100%; height: auto; display: block; }
  svg text { fill: var(--muted); font-size: 12px; font-family: system-ui, sans-serif; }
  svg .axis { stroke: var(--border); stroke-width: 1; }
  svg .tick { stroke: var(--border); stroke-width: 1; stroke-dasharray: 2 3; }
  svg .dot1 { fill: var(--g1); fill-opacity: 0.55; }
  svg .dot2 { fill: var(--g2); fill-opacity: 0.55; }
  svg .mean1 { stroke: var(--g1); stroke-width: 3; }
  svg .mean2 { stroke: var(--g2); stroke-width: 3; }
  svg .anchor { stroke: var(--text); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .legend { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .msg { padding: 14px 16px; border-radius: 10px; background: var(--card); border: 1px solid var(--border); font-size: 15px; line-height: 1.5; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Redwood Results</h1>
  <p class="sub sans" id="updated">&nbsp;</p>

  <div class="toolbar sans">
    <button id="refresh">Refresh</button>
    <label><input type="checkbox" id="logscale"> Log scale for guesses</label>
  </div>

  <div class="msg sans" id="msg" hidden></div>

  <div id="results" hidden>
    <div class="grid" id="summary"></div>

    <div class="card">
      <h2>Question 1: More or less?</h2>
      <div id="q1bars"></div>
    </div>

    <div class="card">
      <h2>Question 2: Individual guesses (feet)</h2>
      <svg id="chart" viewBox="0 0 700 240" role="img" aria-label="Dot plot of guesses by group"></svg>
      <p class="legend sans">Each dot is one student. Thick vertical line = group mean. Dashed line = the number shown to that group.</p>
    </div>

    <div class="card diff" id="diff"></div>
  </div>
</main>

<script>
  // ═════════ SETTINGS ═════════
  // Paste your Apps Script web app URL (the one ending in /exec) between the quotes:
  const RESULTS_URL = "https://script.google.com/macros/s/AKfycbxSZA7QAgLxlSnzf_r8ITaycnIwOOZSszOAjp51-l92eX3qzluEgEtJ_AjxT22Kf30osA/exec";
  // ════════════════════════════

  const $ = (id) => document.getElementById(id);
  const fmt = (n, d) => Number(n).toLocaleString("en-US", { maximumFractionDigits: d === undefined ? 1 : d });
  let DATA = [];

  function clean(rows) {
    return rows.map((r) => ({
      group: String(r.group),
      anchor: Number(r.anchor),
      q1: String(r.q1),
      q2: Number(r.q2)
    })).filter((r) => (r.group === "1" || r.group === "2") && (r.q1 === "more" || r.q1 === "less") && isFinite(r.q2) && r.q2 >= 0);
  }

  function demoData() {
    let s = 12345;
    const rnd = () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
    const out = [];
    for (let i = 0; i < 40; i++) {
      const g = i % 2 === 0 ? "1" : "2";
      const mid = g === "1" ? 650 : 250;
      const guess = Math.max(20, mid * (0.4 + rnd() * 1.2));
      out.push({ group: g, anchor: g === "1" ? 1200 : 180, q1: guess > (g === "1" ? 1200 : 180) ? "more" : "less", q2: Math.round(guess) });
    }
    return out;
  }

  function stats(rows) {
    const v = rows.map((r) => r.q2).sort((a, b) => a - b);
    const n = v.length;
    if (!n) return { n: 0 };
    const mean = v.reduce((a, b) => a + b, 0) / n;
    const median = n % 2 ? v[(n - 1) / 2] : (v[n / 2 - 1] + v[n / 2]) / 2;
    return { n, mean, median, min: v[0], max: v[n - 1] };
  }

  function render() {
    const g = { "1": DATA.filter((r) => r.group === "1"), "2": DATA.filter((r) => r.group === "2") };
    const st = { "1": stats(g["1"]), "2": stats(g["2"]) };
    const anchors = { "1": 1200, "2": 180 };
    $("results").hidden = DATA.length === 0;
    if (!DATA.length) { showMsg("No responses yet. Check back after students have submitted."); return; }
    $("msg").hidden = true;

    // Summary cards
    $("summary").innerHTML = ["1", "2"].map((k) => {
      const s = st[k];
      if (!s.n) return '<div class="card g' + k + '"><div class="lbl sans">Group ' + k + ' (' + fmt(anchors[k], 0) + ' ft)</div><div class="sans">No responses yet</div></div>';
      return '<div class="card g' + k + ' sans">' +
        '<div class="lbl">Group ' + k + ' (' + fmt(anchors[k], 0) + ' ft)</div>' +
        '<div class="big">' + fmt(s.mean, 0) + ' ft</div>' +
        '<div class="lbl">mean guess</div>' +
        '<div class="row"><span>Students</span><span>' + s.n + '</span></div>' +
        '<div class="row"><span>Median</span><span>' + fmt(s.median, 0) + ' ft</span></div>' +
        '<div class="row"><span>Range</span><span>' + fmt(s.min, 0) + ' to ' + fmt(s.max, 0) + ' ft</span></div>' +
        '</div>';
    }).join("");

    // Q1 bars
    $("q1bars").innerHTML = ["1", "2"].map((k) => {
      const rows = g[k];
      if (!rows.length) return "";
      const more = rows.filter((r) => r.q1 === "more").length;
      const less = rows.length - more;
      const pm = (more / rows.length) * 100, pl = 100 - pm;
      return '<div class="barlabel sans">Group ' + k + ': more or less than ' + fmt(anchors[k], 0) + ' ft (n = ' + rows.length + ')</div>' +
        '<div class="bar sans">' +
        (more ? '<div class="more" style="width:' + pm + '%">More ' + more + ' (' + fmt(pm, 0) + '%)</div>' : '') +
        (less ? '<div class="less" style="width:' + pl + '%">Less ' + less + ' (' + fmt(pl, 0) + '%)</div>' : '') +
        '</div>';
    }).join("");

    // Difference
    const d = $("diff");
    if (st["1"].n && st["2"].n) {
      const diff = st["1"].mean - st["2"].mean;
      d.className = "card diff sans";
      d.textContent = "Mean guess for Group 1 is " + fmt(Math.abs(diff), 0) + " ft " + (diff >= 0 ? "higher" : "lower") +
        " than Group 2 (" + fmt(st["1"].mean, 0) + " ft vs " + fmt(st["2"].mean, 0) + " ft).";
    } else {
      d.className = "card diff sans";
      d.textContent = "Waiting for responses from both groups to compare.";
    }

    drawChart(g, st, anchors);
  }

  function svgEl(name, attrs, text) {
    const e = document.createElementNS("http://www.w3.org/2000/svg", name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function drawChart(g, st, anchors) {
    const svg = $("chart");
    svg.innerHTML = "";
    const log = $("logscale").checked;
    const all = DATA.map((r) => r.q2).filter((v) => !log || v > 0);
    const W = 700, left = 90, right = 24, top = 20, axisY = 205;
    const plotW = W - left - right;
    if (!all.length) return;
    let lo, hi, ticks = [];
    const maxAll = Math.max.apply(null, all.concat([1200]));
    if (log) {
      const minPos = Math.min.apply(null, all.concat([180]));
      lo = Math.pow(10, Math.floor(Math.log10(minPos)));
      hi = Math.pow(10, Math.ceil(Math.log10(maxAll)));
      for (let p = lo; p <= hi; p *= 10) ticks.push(p);
    } else {
      lo = 0;
      const step = Math.pow(10, Math.floor(Math.log10(maxAll / 4)));
      const mult = [1, 2, 2.5, 5, 10].find((m) => maxAll / (step * m) <= 6) || 10;
      const t = step * mult;
      hi = Math.ceil(maxAll / t) * t;
      for (let v = 0; v <= hi + 1e-9; v += t) ticks.push(v);
    }
    const sx = (v) => {
      if (log) v = Math.max(v, lo);
      const f = log ? (Math.log10(v) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo)) : (v - lo) / (hi - lo);
      return left + f * plotW;
    };

    svg.appendChild(svgEl("line", { x1: left, x2: W - right, y1: axisY, y2: axisY, class: "axis" }));
    ticks.forEach((t) => {
      const x = sx(t);
      svg.appendChild(svgEl("line", { x1: x, x2: x, y1: top, y2: axisY, class: "tick" }));
      svg.appendChild(svgEl("text", { x: x, y: axisY + 18, "text-anchor": "middle" }, fmt(t, 0)));
    });

    const rowY = { "1": 70, "2": 150 };
    ["1", "2"].forEach((k) => {
      const y = rowY[k];
      svg.appendChild(svgEl("text", { x: left - 10, y: y + 4, "text-anchor": "end" }, "Group " + k));
      // anchor line
      const ax = sx(anchors[k]);
      svg.appendChild(svgEl("line", { x1: ax, x2: ax, y1: y - 36, y2: y + 36, class: "anchor" }));
      // dots with deterministic jitter
      g[k].forEach((r, i) => {
        if (log && r.q2 <= 0) return;
        const jitter = ((i * 37) % 21 - 10) * 2.4;
        svg.appendChild(svgEl("circle", { cx: sx(r.q2), cy: y + jitter, r: 5, class: "dot" + k }));
      });
      // mean line
      if (st[k].n && (!log || st[k].mean > 0)) {
        const mx = sx(st[k].mean);
        svg.appendChild(svgEl("line", { x1: mx, x2: mx, y1: y - 36, y2: y + 36, class: "mean" + k }));
      }
    });
  }

  function showMsg(text) {
    const m = $("msg");
    m.hidden = false;
    m.textContent = text;
  }

  async function load() {
    if (location.hash === "#demo") {
      DATA = demoData();
      $("updated").textContent = "Showing sample data (demo mode).";
      render();
      return;
    }
    if (!RESULTS_URL) {
      showMsg("Setup needed: paste your Apps Script web app URL into RESULTS_URL near the bottom of this file. To preview this page with sample data, add #demo to the link.");
      $("results").hidden = true;
      return;
    }
    $("updated").textContent = "Loading…";
    try {
      const res = await fetch(RESULTS_URL + (RESULTS_URL.indexOf("?") >= 0 ? "&" : "?") + "t=" + Date.now());
      const rows = await res.json();
      DATA = clean(Array.isArray(rows) ? rows : []);
      $("updated").textContent = "Last updated " + new Date().toLocaleTimeString() + " \u2022 " + DATA.length + " response" + (DATA.length === 1 ? "" : "s");
      render();
    } catch (e) {
      $("updated").textContent = "";
      showMsg("Could not load results. Check that the web app is deployed with access set to Anyone and that the URL ends in /exec.");
      $("results").hidden = true;
    }
  }

  $("refresh").addEventListener("click", load);
  $("logscale").addEventListener("change", () => { if (DATA.length) render(); });
  load();
</script>
</body>
</html>
